# 同步文件夹配置文件示例
# 可以通过 -c 参数指定此配置文件: ./sync-folders.sh -c sync-config.conf

# 源文件夹路径
SOURCE_DIR=/Users/qumi/Documents

# 目标文件夹路径
DEST_DIR=/Volumes/Backup/Documents

# 同步模式: one-way(单向) 或 two-way(双向)
SYNC_MODE=one-way

# 排除的文件夹名称，用空格分隔
EXCLUDE_DIRS=.git node_modules .DS_Store build dist

# 指定需要同步的子目录，用空格分隔，如果为空则同步整个目录
# 如果指定了此项，则只会同步这些子目录
INCLUDE_DIRS=photos documents projects

# 是否为模拟运行（不实际修改文件）
DRY_RUN=false

# 是否显示详细信息
VERBOSE=true