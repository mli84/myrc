# 开发同步配置文件 - 从备份目录恢复到开发目录
SOURCE_DIR=/Volumes/mli_hd/code
DEST_DIR=/Users/qumi/code
SYNC_MODE=one-way

# 排除一些不需要同步的目录
EXCLUDE_DIRS=node_modules .idea build dist target .dart_tool .gradle .kotlin 
# 指定需要同步的目录
# INCLUDE_DIRS=Rizzer

# 默认启用删除功能，确保完全同步
DELETE=false

# 默认启用dry-run模式以防止意外覆盖
# DRY_RUN=false

# 显示详细信息，方便检查变更
VERBOSE=true
