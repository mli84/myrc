# providers.conf
# 格式: name|base_url|api_key_env|extra_header(可选)
#
# 新增提供商只需在此文件添加一行，无需修改脚本。
# 自定义/私有提供商（如 Ollama、LiteLLM）同样适用。
#
# name          - 提供商标识符，与 AI-Models.txt 中的 provider 部分对应
# base_url      - API 基础路径（不含末尾路径段如 /chat/completions）
# api_key_env   - 存储 API Key 的环境变量名
# extra_header  - 额外请求头（可选，格式 "Header-Name: value"）

blazeai|https://blazeai.boxu.dev/api/v1|BLAZE_API_KEY|
longcat|https://api.longcat.chat/openai/v1|LONGCAT_API_KEY|
groq|https://api.groq.com/openai/v1|GROQ_API_KEY|
nvidia|https://integrate.api.nvidia.com/v1|NVIDIA_API_KEY|
openroute|https://openrouter.ai/api/v1|OPENROUTER_API_KEY|X-Title: check-models
opencode|https://api.opencode.ai/v1|OPENCODE_API_KEY|
kimi-for-coding|https://api.kimi.com/coding/v1|KIMI_API_KEY|
