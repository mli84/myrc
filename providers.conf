# providers.conf
# 格式: name|base_url|api_key_env|extra_header(可选)
#
# 新增提供商只需在此文件添加一行，无需修改脚本。
# 自定义/私有提供商（如 Ollama、LiteLLM）同样适用。
#
# name          - 提供商标识符，与 AI-Models.txt 中的 provider 部分对应
# base_url      - API 基础路径（不含末尾路径段如 /chat/completions）
# api_key_env   - 存储 API Key 的环境变量名
# extra_header  - 额外请求头（可选，格式 "Header-Name: value"）

